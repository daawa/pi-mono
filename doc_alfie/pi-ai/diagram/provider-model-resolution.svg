<svg viewBox="0 0 1240 820" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    .title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 10px; }
    .region-label { fill: #fbbf24; font-size: 10px; font-weight: 600; }
    .name { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .detail { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
    .arrow-label { fill: #cbd5e1; font-size: 8px; text-anchor: middle; }
    .stage { fill: #94a3b8; font-size: 9px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#0f172a"/>
  <rect width="1240" height="820" fill="url(#grid)"/>

  <text x="32" y="38" class="title">Provider Model Resolution</text>
  <text x="32" y="58" class="subtitle">Bundled baseline + runtime cache + user configuration = effective provider catalog</text>

  <rect x="320" y="92" width="590" height="410" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="334" y="112" class="region-label">PI-CODING-AGENT RUNTIME</text>

  <!-- Connection layer -->
  <path d="M270 175 L365 175" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M270 295 L365 330" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <path d="M555 175 L620 175 L620 218 L645 218" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M555 330 L620 330 L620 250 L645 250" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <path d="M745 268 L745 335" fill="none" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M270 415 L620 415 L620 382 L645 382" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M845 382 L955 300" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="316" y="165" class="arrow-label">imports</text>
  <text x="315" y="299" class="arrow-label">200 / 304</text>
  <text x="602" y="164" class="arrow-label">baseline</text>
  <text x="595" y="315" class="arrow-label">newer only</text>
  <text x="770" y="304" class="arrow-label">merged base</text>
  <text x="444" y="405" class="arrow-label">custom models + overrides</text>
  <text x="905" y="352" class="arrow-label">resolved models</text>

  <!-- Opaque masks -->
  <rect x="50" y="135" width="220" height="80" rx="8" fill="#0f172a"/>
  <rect x="50" y="255" width="220" height="80" rx="8" fill="#0f172a"/>
  <rect x="50" y="375" width="220" height="80" rx="8" fill="#0f172a"/>
  <rect x="365" y="135" width="190" height="80" rx="8" fill="#0f172a"/>
  <rect x="645" y="188" width="200" height="80" rx="8" fill="#0f172a"/>
  <rect x="645" y="335" width="200" height="94" rx="8" fill="#0f172a"/>
  <rect x="955" y="240" width="235" height="120" rx="10" fill="#0f172a"/>

  <!-- Source boxes -->
  <rect x="50" y="135" width="220" height="80" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="160" y="162" class="name">Generated provider data</text>
  <text x="160" y="181" class="detail">packages/ai · src/providers/data</text>
  <text x="160" y="197" class="detail">pi-ai build-time baseline</text>

  <rect x="50" y="255" width="220" height="80" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="160" y="282" class="name">pi.dev catalogs</text>
  <text x="160" y="301" class="detail">remote provider metadata</text>
  <text x="160" y="317" class="detail">fetched during refresh</text>

  <rect x="50" y="375" width="220" height="80" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="160" y="402" class="name">models.json</text>
  <text x="160" y="421" class="detail">user-authored configuration</text>
  <text x="160" y="437" class="detail">custom providers and overrides</text>

  <!-- Runtime boxes -->
  <rect x="365" y="135" width="190" height="80" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="460" y="163" class="name">Built-in provider</text>
  <text x="460" y="182" class="detail">imported from pi-ai</text>
  <text x="460" y="198" class="detail">static list · works offline</text>

  <g transform="translate(365,292)">
    <rect x="0" y="10" width="190" height="58" fill="#0f172a"/>
    <ellipse cx="95" cy="10" rx="95" ry="12" fill="#0f172a"/>
    <ellipse cx="95" cy="68" rx="95" ry="12" fill="#0f172a"/>
    <rect x="0" y="10" width="190" height="58" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="95" cy="10" rx="95" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="95" cy="68" rx="95" ry="12" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="68" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="190" y1="10" x2="190" y2="68" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="95" y="38" class="name">models-store.json</text>
    <text x="95" y="55" class="detail">pi-coding-agent file store</text>
  </g>

  <rect x="645" y="188" width="200" height="80" rx="8" fill="rgba(251,146,60,0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="745" y="216" class="name">Remote merge</text>
  <text x="745" y="235" class="detail">coding-agent remote wrapper</text>
  <text x="745" y="251" class="detail">never deletes bundled-only IDs</text>

  <rect x="645" y="335" width="200" height="94" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="745" y="365" class="name">Provider composer</text>
  <text x="745" y="384" class="detail">coding-agent config layer</text>
  <text x="745" y="400" class="detail">modelOverrides apply last</text>
  <text x="745" y="416" class="detail">auth + API routing composed</text>

  <rect x="955" y="240" width="235" height="120" rx="10" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="2"/>
  <text x="1072" y="274" class="name">Effective catalog</text>
  <text x="1072" y="297" class="detail">used by /model and --list-models</text>
  <text x="1072" y="317" class="detail">provider + model + API metadata</text>
  <text x="1072" y="337" class="detail">availability filtered by auth</text>

  <!-- Bottom precedence panel -->
  <text x="32" y="555" class="title" style="font-size:16px">Same model ID: metadata precedence</text>
  <text x="32" y="575" class="subtitle">Each later layer may replace fields from the previous layer</text>

  <path d="M330 655 L450 655" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M710 655 L830 655" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="390" y="643" class="arrow-label">if cache is newer</text>
  <text x="770" y="643" class="arrow-label">user intent wins</text>

  <rect x="70" y="610" width="260" height="100" rx="8" fill="#0f172a"/>
  <rect x="70" y="610" width="260" height="100" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="200" y="638" class="stage">1 · BUNDLED</text>
  <text x="200" y="663" class="name">openai / gpt-example</text>
  <text x="200" y="684" class="detail">contextWindow: 128000</text>
  <text x="200" y="699" class="detail">stable offline fallback</text>

  <rect x="450" y="610" width="260" height="100" rx="8" fill="#0f172a"/>
  <rect x="450" y="610" width="260" height="100" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="580" y="638" class="stage">2 · RUNTIME OVERLAY</text>
  <text x="580" y="663" class="name">openai / gpt-example</text>
  <text x="580" y="684" class="detail">contextWindow: 256000</text>
  <text x="580" y="699" class="detail">downloaded metadata replaces bundle</text>

  <rect x="830" y="610" width="330" height="100" rx="8" fill="#0f172a"/>
  <rect x="830" y="610" width="330" height="100" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="995" y="638" class="stage">3 · MODELS.JSON OVERRIDE</text>
  <text x="995" y="663" class="name">openai / gpt-example</text>
  <text x="995" y="684" class="detail">contextWindow: 200000</text>
  <text x="995" y="699" class="detail">final effective value: 200000</text>

  <rect x="70" y="748" width="1090" height="42" rx="7" fill="rgba(30,41,59,0.7)" stroke="#475569"/>
  <text x="615" y="774" class="detail" style="font-size:10px;fill:#cbd5e1">Deleting models-store.json removes only layer 2. Deleting models.json removes only layer 3. The bundled baseline remains.</text>
</svg>
