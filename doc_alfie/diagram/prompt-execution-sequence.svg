<svg viewBox="0 0 1380 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Prompt execution sequence</title>
  <desc id="desc">A prompt passes through AgentSession, Agent, agent-loop, pi-ai, a provider, and optional local tools.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
      .actor { fill: #f8fafc; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-size: 8px; text-anchor: middle; }
      .msg { fill: #e2e8f0; font-size: 9px; text-anchor: middle; }
      .return { fill: #94a3b8; font-size: 8px; font-style: italic; text-anchor: middle; }
      .num { fill: #60a5fa; font-size: 7px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1380" height="850" fill="#0f172a"/>
  <rect width="1380" height="850" fill="url(#grid)"/>
  <text x="30" y="34" fill="#f8fafc" font-size="18" font-weight="700">Prompt Execution Sequence</text>
  <text x="30" y="54" fill="#94a3b8" font-size="9">One agent run may contain several turns when the model requests local tools.</text>

  <!-- Lifelines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="6,4">
    <line x1="100" y1="124" x2="100" y2="810"/>
    <line x1="295" y1="124" x2="295" y2="810"/>
    <line x1="490" y1="124" x2="490" y2="810"/>
    <line x1="685" y1="124" x2="685" y2="810"/>
    <line x1="880" y1="124" x2="880" y2="810"/>
    <line x1="1075" y1="124" x2="1075" y2="810"/>
    <line x1="1270" y1="124" x2="1270" y2="810"/>
  </g>

  <!-- Actors -->
  <g>
    <rect x="35" y="76" width="130" height="48" rx="6" fill="#0f172a"/>
    <rect x="35" y="76" width="130" height="48" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="100" y="97" class="actor">Mode</text><text x="100" y="113" class="sub">UI / print / RPC</text>
    <rect x="220" y="76" width="150" height="48" rx="6" fill="#0f172a"/>
    <rect x="220" y="76" width="150" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="295" y="97" class="actor">AgentSession</text><text x="295" y="113" class="sub">application behavior</text>
    <rect x="425" y="76" width="130" height="48" rx="6" fill="#0f172a"/>
    <rect x="425" y="76" width="130" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="490" y="97" class="actor">Agent</text><text x="490" y="113" class="sub">state + queues</text>
    <rect x="610" y="76" width="150" height="48" rx="6" fill="#0f172a"/>
    <rect x="610" y="76" width="150" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="685" y="97" class="actor">agent-loop</text><text x="685" y="113" class="sub">turn execution</text>
    <rect x="815" y="76" width="130" height="48" rx="6" fill="#0f172a"/>
    <rect x="815" y="76" width="130" height="48" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="880" y="97" class="actor">pi-ai</text><text x="880" y="113" class="sub">normalized stream</text>
    <rect x="1010" y="76" width="130" height="48" rx="6" fill="#0f172a"/>
    <rect x="1010" y="76" width="130" height="48" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1075" y="97" class="actor">Provider</text><text x="1075" y="113" class="sub">LLM API</text>
    <rect x="1205" y="76" width="130" height="48" rx="6" fill="#0f172a"/>
    <rect x="1205" y="76" width="130" height="48" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="1270" y="97" class="actor">Local Tool</text><text x="1270" y="113" class="sub">read / bash / edit...</text>
  </g>

  <!-- Activation bars -->
  <rect x="290" y="156" width="10" height="600" rx="2" fill="rgba(6,78,59,0.65)" stroke="#34d399"/>
  <rect x="485" y="245" width="10" height="480" rx="2" fill="rgba(6,78,59,0.65)" stroke="#34d399"/>
  <rect x="680" y="290" width="10" height="390" rx="2" fill="rgba(6,78,59,0.65)" stroke="#34d399"/>
  <rect x="875" y="335" width="10" height="255" rx="2" fill="rgba(6,78,59,0.65)" stroke="#34d399"/>
  <rect x="1070" y="380" width="10" height="105" rx="2" fill="rgba(30,41,59,0.8)" stroke="#94a3b8"/>
  <rect x="1265" y="540" width="10" height="55" rx="2" fill="rgba(120,53,15,0.6)" stroke="#fbbf24"/>

  <!-- Message helpers: numbered circles -->
  <g>
    <circle cx="115" cy="156" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="115" y="159" class="num">1</text>
    <circle cx="310" cy="245" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="310" y="248" class="num">2</text>
    <circle cx="505" cy="290" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="505" y="293" class="num">3</text>
    <circle cx="700" cy="335" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="700" y="338" class="num">4</text>
    <circle cx="895" cy="380" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="895" y="383" class="num">5</text>
    <circle cx="1090" cy="460" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="1090" y="463" class="num">6</text>
    <circle cx="700" cy="540" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="700" y="543" class="num">7</text>
    <circle cx="1250" cy="590" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="1250" y="593" class="num">8</text>
    <circle cx="700" cy="635" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="700" y="638" class="num">9</text>
    <circle cx="475" cy="725" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="475" y="728" class="num">10</text>
    <circle cx="280" cy="770" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="280" y="773" class="num">11</text>
  </g>

  <!-- Messages -->
  <line x1="100" y1="156" x2="295" y2="156" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="198" y="146" class="msg">prompt(text, images?)</text>
  <path d="M295 190 L350 190 L350 220 L300 220" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="385" y="207" class="msg">expand input; hooks; auth; system prompt</text>
  <line x1="295" y1="245" x2="490" y2="245" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="392" y="235" class="msg">agent.prompt()</text>
  <line x1="490" y1="290" x2="685" y2="290" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="280" class="msg">runAgentLoop(context snapshot)</text>
  <line x1="685" y1="335" x2="880" y2="335" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="782" y="325" class="msg">stream(model, context, tools)</text>
  <line x1="880" y1="380" x2="1075" y2="380" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="978" y="370" class="msg">provider request</text>
  <line x1="1075" y1="460" x2="880" y2="460" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="978" y="450" class="return">assistant stream events</text>
  <line x1="880" y1="485" x2="685" y2="485" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="782" y="475" class="return">normalized message updates</text>

  <!-- Optional tool loop -->
  <rect x="650" y="510" width="655" height="125" rx="5" fill="rgba(120,53,15,0.08)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="650" y="510" width="54" height="20" rx="4" fill="rgba(120,53,15,0.4)" stroke="#fbbf24"/>
  <text x="677" y="524" fill="#fbbf24" font-size="8" font-weight="600" text-anchor="middle">loop</text>
  <text x="715" y="524" fill="#94a3b8" font-size="8">[assistant requested tools]</text>
  <line x1="685" y1="540" x2="1270" y2="540" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="978" y="532" class="msg">validate and execute AgentTool</text>
  <line x1="1270" y1="590" x2="685" y2="590" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="978" y="580" class="return">toolResult message + updates</text>
  <path d="M685 610 L740 610 L740 635 L690 635" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="628" class="msg">start next turn with tool result</text>

  <!-- Completion and persistence -->
  <line x1="685" y1="680" x2="490" y2="680" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="588" y="670" class="return">AgentEvent stream</text>
  <line x1="490" y1="725" x2="295" y2="725" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="392" y="715" class="return">message_end / turn_end / agent_end</text>
  <path d="M295 740 L355 740 L355 765 L300 765" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="420" y="758" class="msg">persist each message_end; retry or compact after agent_end</text>
  <line x1="295" y1="800" x2="100" y2="800" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow-open)"/>
  <text x="198" y="790" class="return">AgentSessionEvent updates and settled result</text>

  <text x="30" y="833" fill="#64748b" font-size="8">Time flows downward. The tool frame is skipped when the assistant completes without tool calls.</text>
</svg>
