<svg viewBox="0 0 1280 2340" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .label { fill: #f8fafc; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .detail { fill: #94a3b8; font-size: 10px; text-anchor: middle; }
    .edge-label { fill: #cbd5e1; font-size: 10px; font-weight: 600; }
    .region-label { font-size: 11px; font-weight: 700; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    .happy { fill: none; stroke: #22d3ee; stroke-width: 2.2; marker-end: url(#arrow-cyan); }
    .branch { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
    .error { fill: none; stroke: #fb7185; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-rose); }
    .loopback { fill: none; stroke: #fb923c; stroke-width: 2; stroke-dasharray: 8 5; marker-end: url(#arrow-orange); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="1280" height="2340" fill="#0f172a"/>
  <rect width="1280" height="2340" fill="url(#grid)"/>

  <!-- Loop regions -->
  <rect x="70" y="480" width="1140" height="1840" rx="18" fill="#1c1a24"/>
  <rect x="190" y="550" width="900" height="1430" rx="16" fill="#102733"/>
  <rect x="85" y="490" width="315" height="34" rx="6" fill="#2b2118"/>
  <rect x="755" y="560" width="320" height="34" rx="6" fill="#0b303c"/>
  <text x="242" y="512" fill="#fbbf24" class="region-label" text-anchor="middle">OUTER LOOP · follow-up continuation</text>
  <text x="915" y="582" fill="#22d3ee" class="region-label" text-anchor="middle">INNER LOOP · tool-driven or steering-driven turns</text>

  <!-- Connections -->
  <path d="M640 135 L640 180" class="happy"/>
  <path d="M640 240 L640 280" class="happy"/>
  <path d="M640 355 L640 405" class="happy"/>
  <path d="M640 465 L640 615" class="happy"/>
  <g transform="translate(0 60)">
  <path d="M640 615 L640 665" class="happy"/>
  <path d="M640 725 L640 770" class="happy"/>
  <path d="M640 850 L640 880" class="happy"/>
  <path d="M750 930 L920 930" class="error"/>
  <path d="M640 980 L640 1010" class="happy"/>
  <path d="M640 1110 L640 1160" class="happy"/>
  <path d="M640 1225 L640 1270" class="happy"/>
  <path d="M530 1060 L350 1060 L350 1410 L460 1410" class="branch"/>
  <path d="M640 1330 L640 1380" class="happy"/>
  <path d="M640 1440 L640 1485" class="happy"/>
  <path d="M640 1545 L640 1570" class="happy"/>
  <path d="M750 1620 L920 1620" class="error"/>
  <path d="M640 1670 L640 1710" class="happy"/>
  <path d="M640 1770 L640 1790" class="happy"/>
  <path d="M530 1840 L270 1840 L270 585 L460 585" class="loopback"/>
  <path d="M640 1890 L640 1940" class="happy"/>
  <path d="M640 2000 L640 2020" class="happy"/>
  <path d="M530 2070 L145 2070 L145 585 L460 585" class="loopback"/>
  <path d="M640 2120 L640 2165" class="happy"/>
  </g>

  <!-- Arrow labels -->
  <g transform="translate(0 60)">
  <text x="770" y="916" fill="#fb7185" class="edge-label">error / aborted</text>
  <text x="655" y="1002" fill="#34d399" class="edge-label">normal</text>
  <text x="655" y="1140" fill="#34d399" class="edge-label">yes</text>
  <text x="364" y="1048" fill="#cbd5e1" class="edge-label">no</text>
  <text x="770" y="1606" fill="#fb7185" class="edge-label">true</text>
  <text x="655" y="1695" fill="#34d399" class="edge-label">false</text>
  <text x="285" y="1825" fill="#fb923c" class="edge-label">yes · next inner iteration</text>
  <text x="655" y="1925" fill="#cbd5e1" class="edge-label">no</text>
  <text x="160" y="2055" fill="#fb923c" class="edge-label">yes · inject as pending</text>
  <text x="655" y="2150" fill="#34d399" class="edge-label">no</text>
  </g>

  <!-- Opaque masks and nodes -->
  <rect x="500" y="80" width="280" height="55" rx="28" fill="#0f172a"/>
  <rect x="500" y="80" width="280" height="55" rx="28" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="640" y="113" class="label">runAgentLoop()</text>

  <rect x="500" y="180" width="280" height="60" rx="7" fill="#0f172a"/>
  <rect x="500" y="180" width="280" height="60" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
  <text x="640" y="207" class="label">emit agent_start</text>
  <text x="640" y="225" class="detail">first lifecycle event</text>

  <rect x="470" y="280" width="340" height="75" rx="7" fill="#0f172a"/>
  <rect x="470" y="280" width="340" height="75" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
  <text x="640" y="308" class="label">emit first turn_start</text>
  <text x="640" y="328" class="detail">then prompt message_start / message_end</text>
  <text x="640" y="344" class="detail">continuation runs omit prompt events</text>

  <rect x="500" y="405" width="280" height="60" rx="7" fill="#0f172a"/>
  <rect x="500" y="405" width="280" height="60" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="640" y="432" class="label">poll steering queue</text>
  <text x="640" y="450" class="detail">startup poll before first provider call</text>

  <g transform="translate(0 60)">
  <rect x="460" y="555" width="360" height="60" rx="7" fill="#0f172a"/>
  <rect x="460" y="555" width="360" height="60" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="640" y="582" class="label">emit turn_start</text>
  <text x="640" y="600" class="detail">skipped on first iteration only</text>

  <rect x="460" y="665" width="360" height="60" rx="7" fill="#0f172a"/>
  <rect x="460" y="665" width="360" height="60" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="640" y="692" class="label">inject pending messages</text>
  <text x="640" y="710" class="detail">message_start → message_end → append</text>

  <rect x="460" y="770" width="360" height="80" rx="7" fill="#0f172a"/>
  <rect x="460" y="770" width="360" height="80" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
  <text x="640" y="799" class="label">stream assistant response</text>
  <text x="640" y="819" class="detail">transform → convert → key → provider stream</text>
  <text x="640" y="836" class="detail">message_start → updates → message_end</text>

  <polygon points="640,880 750,930 640,980 530,930" fill="#0f172a"/>
  <polygon points="640,880 750,930 640,980 530,930" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.7"/>
  <text x="640" y="927" class="label">error or</text>
  <text x="640" y="945" class="label">aborted?</text>

  <rect x="920" y="890" width="280" height="80" rx="40" fill="#0f172a"/>
  <rect x="920" y="890" width="280" height="80" rx="40" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.7"/>
  <text x="1060" y="922" class="label">turn_end([])</text>
  <text x="1060" y="942" class="label">agent_end · return</text>
  <text x="1060" y="959" class="detail">no next-turn hooks or queue polls</text>

  <polygon points="640,1010 750,1060 640,1110 530,1060" fill="#0f172a"/>
  <polygon points="640,1010 750,1060 640,1110 530,1060" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
  <text x="640" y="1065" class="label">tool calls?</text>

  <rect x="460" y="1160" width="360" height="65" rx="7" fill="#0f172a"/>
  <rect x="460" y="1160" width="360" height="65" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
  <text x="640" y="1188" class="label">finalize tool batch</text>
  <text x="640" y="1207" class="detail">length ⇒ fail calls; otherwise execute</text>

  <rect x="460" y="1270" width="360" height="60" rx="7" fill="#0f172a"/>
  <rect x="460" y="1270" width="360" height="60" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="640" y="1297" class="label">append ordered tool results</text>
  <text x="640" y="1315" class="detail">currentContext + newMessages</text>

  <rect x="460" y="1380" width="360" height="60" rx="7" fill="#0f172a"/>
  <rect x="460" y="1380" width="360" height="60" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="640" y="1416" class="label">emit turn_end</text>

  <rect x="460" y="1485" width="360" height="60" rx="7" fill="#0f172a"/>
  <rect x="460" y="1485" width="360" height="60" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="640" y="1512" class="label">prepareNextTurn</text>
  <text x="640" y="1530" class="detail">apply context / model / thinking snapshot</text>

  <polygon points="640,1570 750,1620 640,1670 530,1620" fill="#0f172a"/>
  <polygon points="640,1570 750,1620 640,1670 530,1620" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
  <text x="640" y="1617" class="label">shouldStop</text>
  <text x="640" y="1635" class="label">AfterTurn?</text>

  <rect x="920" y="1580" width="280" height="80" rx="40" fill="#0f172a"/>
  <rect x="920" y="1580" width="280" height="80" rx="40" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.7"/>
  <text x="1060" y="1612" class="label">emit agent_end</text>
  <text x="1060" y="1634" class="detail">skip steering and follow-up polls</text>

  <rect x="460" y="1710" width="360" height="60" rx="7" fill="#0f172a"/>
  <rect x="460" y="1710" width="360" height="60" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="640" y="1737" class="label">poll steering queue</text>
  <text x="640" y="1755" class="detail">always after normal turn control hooks</text>

  <polygon points="640,1790 750,1840 640,1890 530,1840" fill="#0f172a"/>
  <polygon points="640,1790 750,1840 640,1890 530,1840" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
  <text x="640" y="1837" class="label">tools continue</text>
  <text x="640" y="1855" class="label">or steering?</text>

  <rect x="480" y="1940" width="320" height="60" rx="7" fill="#0f172a"/>
  <rect x="480" y="1940" width="320" height="60" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="640" y="1967" class="label">poll follow-up queue</text>
  <text x="640" y="1985" class="detail">only after inner loop would stop</text>

  <polygon points="640,2020 750,2070 640,2120 530,2070" fill="#0f172a"/>
  <polygon points="640,2020 750,2070 640,2120 530,2070" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.7"/>
  <text x="640" y="2075" class="label">follow-ups?</text>

  <rect x="500" y="2165" width="280" height="60" rx="30" fill="#0f172a"/>
  <rect x="500" y="2165" width="280" height="60" rx="30" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.8"/>
  <text x="640" y="2201" class="label">emit agent_end</text>
  </g>

  <text x="36" y="38" class="title">Agent loop control flow</text>
  <text x="36" y="62" class="subtitle">Exact ordering in packages/agent/src/agent-loop.ts · normal, stop, error, steering, and follow-up paths</text>
</svg>
