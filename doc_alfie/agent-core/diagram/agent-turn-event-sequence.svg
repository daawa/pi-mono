<svg viewBox="0 0 1500 1390" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .actor { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .message { fill: #e2e8f0; font-size: 10px; text-anchor: middle; }
    .note { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
    .number { fill: #60a5fa; font-size: 8px; font-weight: 700; text-anchor: middle; }
    .sync { fill: none; stroke: #94a3b8; stroke-width: 1.8; marker-end: url(#arrow); }
    .cyan { fill: none; stroke: #22d3ee; stroke-width: 1.8; marker-end: url(#arrow-cyan); }
    .green { fill: none; stroke: #34d399; stroke-width: 1.8; marker-end: url(#arrow-green); }
    .violet { fill: none; stroke: #a78bfa; stroke-width: 1.8; marker-end: url(#arrow-violet); }
    .return { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 7 4; marker-end: url(#arrow); }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1500" height="1390" fill="#0f172a"/>
  <rect width="1500" height="1390" fill="url(#grid)"/>

  <!-- Lifelines and normal-path frame -->
  <line x1="150" y1="145" x2="150" y2="1330" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5"/>
  <line x1="450" y1="145" x2="450" y2="1330" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5"/>
  <line x1="750" y1="145" x2="750" y2="1330" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5"/>
  <line x1="1050" y1="145" x2="1050" y2="1330" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5"/>
  <line x1="1350" y1="145" x2="1350" y2="1330" stroke="#334155" stroke-width="1.3" stroke-dasharray="7 5"/>
  <rect x="270" y="560" width="1160" height="800" rx="8" fill="rgba(30,41,59,0.12)" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <rect x="270" y="560" width="150" height="24" rx="5" fill="rgba(30,41,59,0.9)" stroke="#64748b" stroke-width="1"/>
  <text x="345" y="577" fill="#cbd5e1" font-size="9" font-weight="700" text-anchor="middle">normal tool turn</text>

  <!-- Message arrows -->
  <path d="M150 190 L450 190" class="cyan"/>
  <path d="M450 245 L1350 245" class="green"/>
  <path d="M450 300 L1350 300" class="green"/>
  <path d="M450 355 L1350 355" class="green"/>
  <path d="M450 410 L505 410 L505 445 L450 445" class="sync"/>
  <path d="M450 500 L750 500" class="cyan"/>
  <path d="M750 610 L450 610" class="return"/>
  <path d="M450 665 L1350 665" class="green"/>
  <path d="M450 720 L1050 720" class="violet"/>
  <path d="M1050 775 L1350 775" class="violet"/>
  <path d="M1050 830 L1110 830 L1110 865 L1050 865" class="sync"/>
  <path d="M1050 920 L1350 920" class="violet"/>
  <path d="M1050 975 L1350 975" class="violet"/>
  <path d="M1050 1030 L450 1030" class="return"/>
  <path d="M450 1085 L510 1085 L510 1120 L450 1120" class="sync"/>
  <path d="M450 1175 L1350 1175" class="green"/>
  <path d="M450 1230 L510 1230 L510 1265 L450 1265" class="sync"/>
  <path d="M450 1315 L510 1315 L510 1350 L450 1350" class="sync"/>

  <!-- Number badges -->
  <g>
    <circle cx="175" cy="190" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="175" y="193" class="number">1</text>
    <circle cx="475" cy="245" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="248" class="number">2</text>
    <circle cx="475" cy="300" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="303" class="number">3</text>
    <circle cx="475" cy="355" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="358" class="number">4</text>
    <circle cx="475" cy="410" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="413" class="number">5</text>
    <circle cx="475" cy="500" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="503" class="number">6</text>
    <circle cx="475" cy="610" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="613" class="number">7</text>
    <circle cx="475" cy="665" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="668" class="number">8</text>
    <circle cx="475" cy="720" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="723" class="number">9</text>
    <circle cx="1075" cy="775" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="1075" y="778" class="number">10</text>
    <circle cx="1075" cy="830" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="1075" y="833" class="number">11</text>
    <circle cx="1075" cy="920" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="1075" y="923" class="number">12</text>
    <circle cx="1075" cy="975" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="1075" y="978" class="number">13</text>
    <circle cx="475" cy="1030" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="1033" class="number">14</text>
    <circle cx="475" cy="1085" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="1088" class="number">15</text>
    <circle cx="475" cy="1175" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="1178" class="number">16</text>
    <circle cx="475" cy="1230" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="1233" class="number">17</text>
    <circle cx="475" cy="1315" r="11" fill="#0f172a" stroke="#60a5fa"/><text x="475" y="1318" class="number">18</text>
  </g>

  <!-- Message labels -->
  <text x="300" y="181" class="message">runAgentLoop(prompts, context, config)</text>
  <text x="900" y="236" class="message">agent_start</text>
  <text x="900" y="291" class="message">turn_start</text>
  <text x="900" y="346" class="message">prompt message_start / message_end</text>
  <text x="555" y="430" class="message">startup steering poll</text>
  <text x="600" y="491" class="message">streamFunction(model, llmContext, options)</text>
  <text x="600" y="601" class="message">stream events + final assistant message</text>
  <text x="900" y="656" class="message">assistant message_start / updates / message_end</text>
  <text x="750" y="711" class="message">executeToolCalls(...)</text>
  <text x="1200" y="766" class="message">tool_execution_start</text>
  <text x="1180" y="846" class="message">prepare → validate → before → execute → after</text>
  <text x="1200" y="911" class="message">tool_execution_end</text>
  <text x="1200" y="966" class="message">tool-result message_start / message_end</text>
  <text x="750" y="1021" class="message">ordered toolResults</text>
  <text x="600" y="1101" class="message">append results to loop context</text>
  <text x="900" y="1166" class="message">turn_end(message, toolResults)</text>
  <text x="620" y="1246" class="message">prepareNextTurn → apply snapshot</text>
  <text x="620" y="1331" class="message">shouldStopAfterTurn → steering poll</text>

  <!-- Actor boxes -->
  <g>
    <rect x="60" y="90" width="180" height="55" rx="7" fill="#0f172a"/>
    <rect x="60" y="90" width="180" height="55" rx="7" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.6"/>
    <text x="150" y="123" class="actor">Agent wrapper</text>

    <rect x="360" y="90" width="180" height="55" rx="7" fill="#0f172a"/>
    <rect x="360" y="90" width="180" height="55" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="450" y="123" class="actor">runLoop</text>

    <rect x="660" y="90" width="180" height="55" rx="7" fill="#0f172a"/>
    <rect x="660" y="90" width="180" height="55" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.6"/>
    <text x="750" y="123" class="actor">Provider stream</text>

    <rect x="960" y="90" width="180" height="55" rx="7" fill="#0f172a"/>
    <rect x="960" y="90" width="180" height="55" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="1050" y="123" class="actor">Tool batch</text>

    <rect x="1260" y="90" width="180" height="55" rx="7" fill="#0f172a"/>
    <rect x="1260" y="90" width="180" height="55" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="1350" y="123" class="actor">Event listeners</text>
  </g>

  <text x="36" y="38" class="title">Normal tool-turn event sequence</text>
  <text x="36" y="62" class="subtitle">Time flows downward · error/abort short-circuits after assistant message_end to turn_end([]) → agent_end</text>
</svg>
